<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puma Run - PUMA</title>
  <link rel="icon" type="image/png" href="/static/img/favicon.png">
  <link rel="stylesheet" href="/static/css/output.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    .pixel-font { font-family: 'Press Start 2P', ui-monospace, monospace; }
    .pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
  </style>
</head>
<body class="bg-puma-bg min-h-screen flex flex-col items-center justify-center p-6">

  <div class="max-w-4xl w-full">
    <a href="/about" class="text-sm text-gray-400 hover:text-puma-primary">&larr; Back to About</a>

    <!-- Arcade screen -->
    <div class="rounded-2xl mt-4 p-5" style="background:#ffe1ec; border:2px solid #f6a9c9;">
      <div class="flex items-start justify-between mb-3 pixel-font" style="color:#c2246a;">
        <div id="game-message" class="text-[10px] sm:text-xs leading-relaxed">Press SPACE to jump</div>
        <div class="text-right text-[10px] sm:text-xs leading-relaxed">
          <span style="color:#e07aa8;">HI <span id="best-score">000000</span></span>
          <span style="color:#4a0d29; margin-left:10px;" id="score">000000</span>
        </div>
      </div>

      <canvas id="game-canvas" width="1400" height="480"
              class="w-full rounded-lg cursor-pointer pixelated"
              style="background:#ffe6f0; max-width:100%; touch-action:none;"></canvas>
    </div>
  </div>

<script>
(function () {
  // ------------------------------------------------------------------
  // Real sprite images (uploaded pixel-art), replacing the procedural
  // bitmap-drawn placeholders.
  // ------------------------------------------------------------------
  var SPRITES = {
    puma: { src: '/static/img/game/puma-run.png', aspect: 177 / 103 },
    pumaRun2: { src: '/static/img/game/puma-run2.png', aspect: 182 / 110 },
    pumaJump: { src: '/static/img/game/puma-jump.png', aspect: 185 / 110 },
    pumaGameOver: { src: '/static/img/game/puma-gameover.png', aspect: 268 / 110 },
    cactus: { src: '/static/img/game/cactus.png', aspect: 83 / 110 },
    rock: { src: '/static/img/game/rock.png', aspect: 91 / 57 },
    bush: { src: '/static/img/game/bush.png', aspect: 84 / 57 },
    bird: { src: '/static/img/game/bird.png', aspect: 107 / 91 },
    cloud1: { src: '/static/img/game/cloud-1.png', aspect: 218 / 96 },
    cloud2: { src: '/static/img/game/cloud-2.png', aspect: 159 / 79 },
    cloud3: { src: '/static/img/game/cloud-3.png', aspect: 142 / 73 },
    cloud4: { src: '/static/img/game/cloud-4.png', aspect: 127 / 67 },
    mountain1: { src: '/static/img/game/mountain-1.png', aspect: 393 / 128 },
    mountain2: { src: '/static/img/game/mountain-2.png', aspect: 231 / 72 },
    mountain3: { src: '/static/img/game/mountain-3.png', aspect: 673 / 102 }
  };
  var loadedCount = 0;
  var totalSprites = Object.keys(SPRITES).length;
  Object.keys(SPRITES).forEach(function (key) {
    var s = SPRITES[key];
    s.img = new Image();
    s.loaded = false;
    s.img.onload = function () { s.loaded = true; loadedCount++; };
    s.img.src = s.src;
  });

  // ------------------------------------------------------------------
  // Game
  // ------------------------------------------------------------------
  var canvas = document.getElementById('game-canvas');
  var ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  var scoreEl = document.getElementById('score');
  var bestScoreEl = document.getElementById('best-score');
  var messageEl = document.getElementById('game-message');

  var CSS_WIDTH = 700, CSS_HEIGHT = 240;
  var DPR = window.devicePixelRatio || 1;
  canvas.width = CSS_WIDTH * DPR;
  canvas.height = CSS_HEIGHT * DPR;
  ctx.scale(DPR, DPR);
  ctx.imageSmoothingEnabled = false;

  var GROUND_Y = 190;
  var GRAVITY = 0.7;
  var JUMP_VELOCITY = -12.5;
  var CHAR_X = 40;
  var CHAR_H = 46;
  var CHAR_W = CHAR_H * SPRITES.puma.aspect;

  // The game-over art is a lying-down pose that's much bulkier/wider than
  // the running pose, so drawing it into the same CHAR_W x CHAR_H box (built
  // for the slimmer running sprite's aspect ratio) squashes it and makes it
  // read as noticeably bigger. Give it its own, smaller box at its own
  // aspect ratio instead, sized to look like the same puma "scale" as the
  // running sprite.
  var GAMEOVER_H = 30;
  var GAMEOVER_W = GAMEOVER_H * SPRITES.pumaGameOver.aspect;

  var OBSTACLE_TYPES = [
    // Sized to roughly match the reference sheet's proportions: cactus
    // and bird read as the tall/large silhouettes, rock and bush as the
    // smaller low ones.
    { sprite: SPRITES.cactus, ground: true, h: 54 },
    { sprite: SPRITES.rock, ground: true, h: 34 },
    { sprite: SPRITES.bush, ground: true, h: 34 },
    { sprite: SPRITES.bird, ground: false, h: 52, flyHeight: 100 }
  ];

  var TXT_DARK = '#4a0d29';

  var STORAGE_KEY = 'puma-run-best-score';
  var bestScore = parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
  bestScoreEl.textContent = pad(bestScore);

  function pad(n) {
    return String(n).padStart(6, '0');
  }

  var state = 'ready'; // 'ready' | 'running' | 'gameover'
  var charY, velocityY, isJumping;
  var speed, obstacles, distance, score, nextObstacleDistance, frame;
  var clouds, mountains;

  function initScenery() {
    // Fixed, deterministic layout (not randomized per run) mirroring the
    // reference composition: a cluster of clouds upper-left/center plus
    // one distant cloud to the right, and a pale low hill layer on the
    // left blending into a taller multi-peak range on the right.
    // Cloud layout (position + size) is copied directly from the
    // reference photo's spacing: cloud-1 is the big topmost cluster,
    // cloud-2 sits lower-left, cloud-3 lower-right, and cloud-4 is the
    // small one lowest/most central - proportions and gaps mirror the
    // reference rather than being eyeballed.
    clouds = [
      { sprite: SPRITES.cloud1, x: 190, y: 16, h: 30 },
      { sprite: SPRITES.cloud2, x: 72, y: 48, h: 24 },
      { sprite: SPRITES.cloud3, x: 606, y: 50, h: 22 },
      { sprite: SPRITES.cloud4, x: 296, y: 80, h: 20 }
    ];
    clouds.forEach(function (c) { c.w = c.h * c.sprite.aspect; });

    mountains = [
      { sprite: SPRITES.mountain2, x: -30, h: 36 },
      { sprite: SPRITES.mountain2, x: 70, h: 34 },
      { sprite: SPRITES.mountain2, x: 190, h: 38 },
      { sprite: SPRITES.mountain3, x: 330, h: 58 }
    ];
    mountains.forEach(function (m) { m.w = m.h * m.sprite.aspect; });
  }

  function resetGame() {
    charY = GROUND_Y - CHAR_H;
    velocityY = 0;
    isJumping = false;
    speed = 5.2;
    obstacles = [];
    distance = 0;
    score = 0;
    frame = 0;
    nextObstacleDistance = 220 + Math.random() * 150;
    scoreEl.textContent = pad(0);
    initScenery();
  }

  function jump() {
    if (state === 'ready') {
      state = 'running';
      messageEl.textContent = '';
      resetGame();
      requestAnimationFrame(loop);
      return;
    }
    if (state === 'gameover') {
      state = 'ready';
      jump();
      return;
    }
    if (!isJumping) {
      velocityY = JUMP_VELOCITY;
      isJumping = true;
    }
  }

  function update() {
    frame++;
    distance += speed;
    speed += 0.0025;

    velocityY += GRAVITY;
    charY += velocityY;
    if (charY > GROUND_Y - CHAR_H) {
      charY = GROUND_Y - CHAR_H;
      velocityY = 0;
      isJumping = false;
    }

    if (distance >= nextObstacleDistance) {
      var type = OBSTACLE_TYPES[Math.floor(Math.random() * OBSTACLE_TYPES.length)];
      var h = type.h;
      var w = h * type.sprite.aspect;
      obstacles.push({ x: CSS_WIDTH, type: type, w: w, h: h });
      nextObstacleDistance = distance + 200 + Math.random() * 220 - speed * 8;
    }

    for (var i = obstacles.length - 1; i >= 0; i--) {
      var ob = obstacles[i];
      ob.x -= speed;
      if (ob.x < -60) {
        obstacles.splice(i, 1);
        continue;
      }
      var obY = ob.type.ground ? GROUND_Y - ob.h : GROUND_Y - ob.type.flyHeight;
      var pad2 = 6;
      var charLeft = CHAR_X + pad2, charRight = CHAR_X + CHAR_W - pad2;
      var charTop = charY + pad2, charBottom = charY + CHAR_H - pad2;
      var obLeft = ob.x + pad2, obRight = ob.x + ob.w - pad2;
      var obTop = obY + pad2, obBottom = obY + ob.h - pad2;
      if (charRight > obLeft && charLeft < obRight && charBottom > obTop && charTop < obBottom) {
        gameOver();
        return;
      }
    }

    score = Math.floor(distance / 10);
    scoreEl.textContent = pad(score);
  }

  function gameOver() {
    state = 'gameover';
    if (score > bestScore) {
      bestScore = score;
      localStorage.setItem(STORAGE_KEY, String(bestScore));
      bestScoreEl.textContent = pad(bestScore);
      messageEl.textContent = 'NEW BEST! PRESS SPACE';
    } else {
      messageEl.textContent = 'GAME OVER - PRESS SPACE';
    }
  }

  function draw() {
    ctx.clearRect(0, 0, CSS_WIDTH, CSS_HEIGHT);

    mountains.forEach(function (m) {
      if (m.sprite.loaded) ctx.drawImage(m.sprite.img, m.x, GROUND_Y - m.h, m.w, m.h);
    });
    // Runtime smoothing was making cloud edges look faded/hazy rather than
    // crisp - the source art already has soft anti-aliased edges, and
    // blurring it further on top just spreads that into a paler halo.
    // Draw at the same nearest-neighbor setting as everything else and
    // rely on the offline-cleaned source art for quality instead.
    clouds.forEach(function (c) {
      if (c.sprite.loaded) ctx.drawImage(c.sprite.img, c.x, c.y, c.w, c.h);
    });

    ctx.strokeStyle = TXT_DARK;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, GROUND_Y);
    ctx.lineTo(CSS_WIDTH, GROUND_Y);
    ctx.stroke();
    ctx.fillStyle = '#f2a0c4';
    for (var gx = -((frame * (state === 'running' ? speed : 0)) % 18); gx < CSS_WIDTH; gx += 18) {
      ctx.fillRect(gx, GROUND_Y + 6, 3, 3);
    }

    // character - cycles between two running frames on the ground, a
    // dedicated pose while airborne, and a dedicated pose on game over
    var puma = SPRITES.puma;
    if (puma.loaded) {
      var sprite;
      if (state === 'gameover') {
        sprite = SPRITES.pumaGameOver.loaded ? SPRITES.pumaGameOver : puma;
        // Bottom/left-align to the ground line, like the puma settling
        // down, rather than reusing the running sprite's box.
        ctx.drawImage(sprite.img, CHAR_X, GROUND_Y - GAMEOVER_H, GAMEOVER_W, GAMEOVER_H);
      } else if (isJumping) {
        sprite = SPRITES.pumaJump.loaded ? SPRITES.pumaJump : puma;
        ctx.drawImage(sprite.img, CHAR_X, charY, CHAR_W, CHAR_H);
      } else {
        sprite = (Math.floor(frame / 6) % 2 === 0 || !SPRITES.pumaRun2.loaded) ? puma : SPRITES.pumaRun2;
        var bob = state === 'running' ? Math.sin(frame * 0.6) * 2 : 0;
        ctx.drawImage(sprite.img, CHAR_X, charY + bob, CHAR_W, CHAR_H);
      }
    }

    // obstacles
    obstacles.forEach(function (ob) {
      var obY = ob.type.ground ? GROUND_Y - ob.h : GROUND_Y - ob.type.flyHeight;
      if (ob.type.sprite.loaded) {
        ctx.drawImage(ob.type.sprite.img, ob.x, obY, ob.w, ob.h);
      }
    });
  }

  function loop() {
    if (state !== 'running') {
      draw();
      return;
    }
    update();
    draw();
    if (state === 'running') {
      requestAnimationFrame(loop);
    }
  }

  initScenery();
  resetGame();
  draw();
  // keep redrawing on the ready screen until images finish loading
  var readyPoll = setInterval(function () {
    if (state === 'ready') { draw(); }
    if (loadedCount >= totalSprites) { clearInterval(readyPoll); draw(); }
  }, 100);

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space') {
      e.preventDefault();
      jump();
    }
  });
  canvas.addEventListener('mousedown', jump);
  canvas.addEventListener('touchstart', function (e) {
    e.preventDefault();
    jump();
  }, { passive: false });
})();
</script>

</body>
</html>
